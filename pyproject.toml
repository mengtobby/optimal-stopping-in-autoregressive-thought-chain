[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osc"
version = "0.1.0"
description = "Optimal stopping in autoregressive thought chains"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
model = ["torch>=2.3", "transformers>=4.45", "datasets>=2.20", "accelerate>=0.33"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: needs torch/transformers and model weights (skipped by default)"]

[tool.coverage.run]
source = ["osc"]
omit = ["src/osc/collect/hf_backend.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
